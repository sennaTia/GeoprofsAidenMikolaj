<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>VerlofPortaal - Inloggen</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="login-kaart">

    <div class="icoon">📅</div>

    <h1 class="titel">Verlof<span class="titel-accent">Portaal</span></h1>
    <p class="subtekst">Log in om je verlof te beheren en plannen</p>

    <form method="POST" action="/inloggen">
      <label for="rol" class="form-label">Rol</label>
      <select id="rol" name="rol" class="form-input">
        <option value="manager">Manager</option>
        <option value="office-manager">Office manager</option>
        <option value="werkgever">Werkgever</option>
        <option value="werknemer">Werknemer</option>
      </select>

      <label for="email" class="form-label">E-mailadres</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="naam@bedrijf.nl">

      <label for="wachtwoord" class="form-label">Wachtwoord</label>
      <input type="password" id="wachtwoord" name="password" class="form-input" placeholder="Wachtwoord">

      <a href="#" class="wachtwoord-vergeten">Wachtwoord vergeten?</a>

      <button type="submit" class="login-knop">Inloggen</button>
    </form>

    <p class="footer-tekst">
      Nog geen account? <a href="#">Neem contact op met je werkgever.</a>
    </p>

  </div>

</body>
</html>
